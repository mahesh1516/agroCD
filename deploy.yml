apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeploy
  namespace: myapp
spec:
  replicas: 4
  selector:
    matchLabels:
      app: swiggy
  template:
    metadata:
      labels:
        app: swiggy
    spec:
      containers:
        - name: cont1
          image: maheshnaramdas/tictac:game
          ports:
            - containerPort: 80
